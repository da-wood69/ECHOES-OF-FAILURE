<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#05080d">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #05080d;
      }

      * { box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 76% 18%, rgba(240, 201, 135, 0.13), transparent 26rem),
          radial-gradient(circle at 28% 76%, rgba(111, 231, 255, 0.10), transparent 30rem),
          #05080d;
      }

      body {
        display: grid;
        place-items: center;
      }

      #unity-shell {
        position: relative;
        width: min(100vw, 177.778vh);
        aspect-ratio: 16 / 9;
        overflow: hidden;
        background: #05080d;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.58);
      }

      #unity-canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
        background: {{{ BACKGROUND_COLOR }}};
      }

      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          linear-gradient(90deg, rgba(5, 8, 13, 0.96), rgba(5, 8, 13, 0.70)),
          repeating-linear-gradient(0deg, transparent 0 5px, rgba(111, 231, 255, 0.025) 5px 6px);
        transition: opacity 420ms ease, visibility 420ms ease;
      }

      #loading.ready {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loader-card {
        width: min(34rem, calc(100% - 4rem));
      }

      .eyebrow {
        margin: 0 0 0.8rem;
        color: #6fe7ff;
        font-size: clamp(0.68rem, 1.1vw, 0.86rem);
        font-weight: 750;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        color: #eef2f3;
        font-size: clamp(2rem, 5.5vw, 4.4rem);
        font-weight: 610;
        letter-spacing: -0.045em;
        line-height: 0.98;
      }

      .tagline {
        margin: 1rem 0 2.4rem;
        color: rgba(238, 242, 243, 0.68);
        font-size: clamp(0.82rem, 1.5vw, 1.05rem);
      }

      .track {
        height: 3px;
        overflow: hidden;
        background: rgba(238, 242, 243, 0.13);
      }

      #bar {
        width: 0;
        height: 100%;
        background: linear-gradient(90deg, #6fe7ff, #f0c987);
        box-shadow: 0 0 18px rgba(111, 231, 255, 0.54);
        transition: width 100ms linear;
      }

      #status {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        margin-top: 0.75rem;
        color: rgba(238, 242, 243, 0.46);
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      #fullscreen {
        position: absolute;
        right: 1rem;
        bottom: 1rem;
        z-index: 3;
        padding: 0.65rem 0.8rem;
        border: 1px solid rgba(238, 242, 243, 0.18);
        border-radius: 0;
        color: rgba(238, 242, 243, 0.72);
        background: rgba(5, 8, 13, 0.68);
        font: inherit;
        font-size: 0.68rem;
        font-weight: 750;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: color 160ms ease, border-color 160ms ease, opacity 240ms ease;
      }

      #fullscreen.visible {
        opacity: 1;
        pointer-events: auto;
      }

      #fullscreen:hover,
      #fullscreen:focus-visible {
        color: #eef2f3;
        border-color: #6fe7ff;
        outline: none;
      }

      @media (max-width: 720px) {
        .loader-card { width: calc(100% - 2.5rem); }
        #fullscreen { right: 0.55rem; bottom: 0.55rem; }
      }
    </style>
  </head>
  <body>
    <main id="unity-shell">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="0"></canvas>
      <section id="loading" aria-live="polite">
        <div class="loader-card">
          <p class="eyebrow">Recovery link</p>
          <h1>Echoes of Failure</h1>
          <p class="tagline">Every fall leaves a way forward.</p>
          <div class="track"><div id="bar"></div></div>
          <div id="status"><span>Restoring Helix Station</span><span id="percent">0%</span></div>
        </div>
      </section>
      <button id="fullscreen" type="button" aria-label="Enter fullscreen">Fullscreen</button>
    </main>

    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#loading");
      const bar = document.querySelector("#bar");
      const percent = document.querySelector("#percent");
      const status = document.querySelector("#status span");
      const fullscreen = document.querySelector("#fullscreen");

      createUnityInstance(canvas, {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, (progress) => {
        const value = Math.round(progress * 100);
        bar.style.width = `${value}%`;
        percent.textContent = `${value}%`;
      }).then((unityInstance) => {
        loading.classList.add("ready");
        fullscreen.classList.add("visible");
        fullscreen.addEventListener("click", () => unityInstance.SetFullscreen(1));
        canvas.addEventListener("pointerdown", () => canvas.focus());
        canvas.focus();
      }).catch((message) => {
        status.textContent = "Recovery link failed";
        percent.textContent = "";
        console.error(message);
      });
    </script>
  </body>
</html>
